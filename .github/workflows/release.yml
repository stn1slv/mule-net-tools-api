name: Release

# Pushing a version tag builds the app and opens a draft GitHub Release with the
# deployable jar attached. The release stays a draft so the notes can be edited
# before anything becomes public.
on:
  push:
    # Version-shaped tags only, so an unrelated tag does not produce a failed run.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Lets a failed run be retried from the Actions tab without deleting and
  # re-pushing the tag. Select the tag as the ref when running it.
  workflow_dispatch:

permissions:
  contents: write # required to create the release

# Never run two releases for the same ref at once, and never cancel one midway:
# a half-finished release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs rather than tags, because this job holds
      # contents: write and a moved tag would otherwise change what runs.
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # --generate-notes needs the previous tags to work out what changed.
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Runs before the build so a mistyped tag fails in seconds rather than
      # after a full package. A leading "v" is tolerated because the tag history
      # mixes both conventions (v2.4.0 and 2.5.0).
      - name: Check the tag matches the pom version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pom=$(python3 -c "import xml.etree.ElementTree as ET; \
            ns={'m':'http://maven.apache.org/POM/4.0.0'}; \
            print(ET.parse('pom.xml').getroot().find('m:version', ns).text)")
          echo "tag=$tag pom=$pom"
          if [ "$tag" != "$pom" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match the pom version '$pom'. Bump the pom or fix the tag."
            exit 1
          fi
          echo "version=$pom" >> "$GITHUB_OUTPUT"

      - name: Build
        run: mvn --batch-mode clean package

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jar="target/net-tools-api-${VERSION}-mule-application.jar"
          test -f "$jar" || { echo "::error::Expected artifact not found: $jar"; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            --title "$VERSION" \
            "$jar"
