name: Release

# Pushing a version tag builds the app and publishes a GitHub Release with the
# deployable jar attached. It is published straight away rather than left as a
# draft, so the tag alone is enough to ship. Which release carries GitHub's
# "Latest" label is left to GitHub, which works it out from date and version.
on:
  push:
    # Version-shaped tags only, so an unrelated tag does not produce a failed run.
    # These are glob patterns, not regular expressions: '*' is "zero or more
    # characters", so avoid '+' here, whose glob meaning is easy to get wrong.
    # The tag-versus-pom guard below rejects anything that slips through.
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  # Lets a failed run be retried from the Actions tab without deleting and
  # re-pushing the tag. Select the tag as the ref when running it.
  workflow_dispatch:

permissions:
  contents: write # required to create the release

# Never run two releases for the same ref at once, and never cancel one midway:
# a half-finished release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs rather than tags, because this job holds
      # contents: write and a moved tag would otherwise change what runs.
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # --generate-notes needs the previous tags to work out what changed.
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Runs before the build so a mistyped tag fails in seconds rather than
      # after a full package. A leading "v" is tolerated because the tag history
      # mixes both conventions (v2.4.0 and 2.5.0).
      - name: Check the tag matches the pom version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pom=$(python3 -c "import xml.etree.ElementTree as ET; \
            ns={'m':'http://maven.apache.org/POM/4.0.0'}; \
            print(ET.parse('pom.xml').getroot().find('m:version', ns).text)")
          echo "tag=$tag pom=$pom"
          if [ "$tag" != "$pom" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match the pom version '$pom'. Bump the pom or fix the tag."
            exit 1
          fi
          echo "version=$pom" >> "$GITHUB_OUTPUT"

      - name: Build
        run: mvn --batch-mode clean package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jar="target/net-tools-api-${VERSION}-mule-application.jar"
          test -f "$jar" || { echo "::error::Expected artifact not found: $jar"; exit 1; }
          # Idempotent, so re-running via workflow_dispatch after a partial failure
          # attaches the jar instead of failing with "release already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists; replacing the attached artifact."
            gh release upload "$GITHUB_REF_NAME" "$jar" --clobber
            # Uploading leaves the draft flag alone, so an existing draft would
            # stay unpublished. Clearing it keeps "a pushed tag ships" true on
            # this path too; it is a no-op on an already published release.
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            # No --draft, so the release is public as soon as the tag is pushed.
            # --latest is deliberately not passed either: gh then leaves the
            # "Latest" flag to GitHub, which picks it from the date and version,
            # so a release cut from an older branch cannot displace a newer one.
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes \
              --title "$VERSION" \
              "$jar"
          fi
